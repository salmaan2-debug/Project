<!DOCTYPE html> 

<!-- Blog page: renders posts from data/posts.json and provides live filtering. -->

<html lang = "en" >

<head>

<title> Blog Section </title>

<meta charset = "utf-8" />

<meta name = "viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"  href="styles.css">

<script src="https://kit.fontawesome.com/4fd3632f56.js" crossorigin="anonymous"></script>
</head>

<body>
<script>
	const savedTheme = localStorage.getItem('theme') || 'light';
	document.body.setAttribute('data-theme', savedTheme);
</script>
<h1> Blog Page </h1>
<p> Welcome to the Blog Section!! </p>
<!-- Header loads dynamically and includes the theme switcher button. -->
<div id="header-placeholder"></div>
<div class = "search-bar">
	<input type="text" id="filter-input" placeholder="Filter posts..." style="color:black">
	<div id="no-results" class="error-message" style="display: none;">
		No posts found.
	</div>
</div>
<div id="Blog-list"></div>

<script src="js/filter.js"></script>
<script src="js/blog.js"></script>

<div id="footer-placeholder"></div>

<!-- Load shared header/footer components after placeholder elements are present. -->
<script src="js/component.js"></script>

</body>

</html>
