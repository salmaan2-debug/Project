<!DOCTYPE html> 

<!-- Projects page: displays project cards and enables live search filtering. -->

<html lang = "en" >

<head>

<title> Projects Section </title>

<meta charset = "utf-8" />

<meta name = "viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"  href="styles.css">


<script src="https://kit.fontawesome.com/4fd3632f56.js" crossorigin="anonymous"></script>


</head>

<body>
<script>
	const savedTheme = localStorage.getItem('theme') || 'light';
	document.body.setAttribute('data-theme', savedTheme);
</script>
<h1> Project Page </h1>
<!-- Header loads dynamically with the theme toggle button. -->
<div id="header-placeholder"></div>

<p> Welcome to the Projects Page! </p>

<div class = "search-bar">

	<div id="no-results" class="error-message" style="display: none;">
		No projects found.
	</div>
</div>

<main class="gallery-container">
	<div class = "project-card">
		<a href="ITEC_3220_Assignment.pdf" download = "Assignment_1.pdf"><img src = "ER_Diagram.jpg" alt = "ER_Diagram logo" style = "width:200px; height:auto;"></a>
		
		<h3>ITEC 3220 Assignment 1</h3>
		
		<p>Created a ER Diagram based on a word problem, a relational schema based on a ER Diagram and SQL queries</p>
		
	</div>
	
	<div class = "project-card">
		<a href="WWE_1_Assignment.pdf" download = "WWE_1_Assignment.pdf"><img src ="Manual.jpg" alt = "Manual logo" style = "width:200px; height:auto;"></a>
		
		<h3>WWE 1 Assignment</h3>
		
		<p>Created my first professional user manual</p>
		
	</div>
	
</main>

<div id="footer-placeholder"></div>

<!-- Shared components and search filtering are initialized here. -->
<script src="js/component.js"></script>
<script src="js/filter.js"></script>
</body>

</html>
