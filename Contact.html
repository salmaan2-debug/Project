<!DOCTYPE html> 

<!-- Contact page: includes a custom validated contact form and social media links. -->

<html lang = "en" >

<head>

<title> Contact Section </title>

<meta charset = "utf-8" />

<meta name = "viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"  href="styles.css">


<script src="https://kit.fontawesome.com/4fd3632f56.js" crossorigin="anonymous"></script>


<style>

	#contact-form {
		display: flex;
		flex-direction: column;
		width: 300px;
		margin: 0 auto;
	}

	#contact-form input[type="submit"] {
		color: black;
	}

	h1, p, h3, .Link-card, .Github-card {
		text-align: center;
	}


</style>

</head>

<body>
	<script>
	const savedTheme = localStorage.getItem('theme') || 'light';
	document.body.setAttribute('data-theme', savedTheme);
</script>

<h1> Contact Page </h1>
<div id="header-placeholder"></div>

<p> Welcome to the Contact Section!! </p>

<form id="contact-form" novalidate>
	<!-- The validation script adds inline error messages directly under each field. -->
	<label for="name">Name:</label><br>
	<input type="text" id="name" name="name" required><br>
	<label for ="email">Email:</label><br>
	<input type="email" id="email" name="email" required><br>
	<label for="subject">Subject:</label><br>
	<input type="text" id="subject" name="subject" required><br>
	<label for="message">Message:</label><br>
	<textarea id="message" name="message" required></textarea><br><br>
	<label for="send">Send:</label><br>
	<input type="submit" id="send" name="send"><br>
	
</form>

<h3> Social Media Links </h3>

<main class = "social-media-links-container">
	<div class = "Link-card">
		<a href="https://www.linkedin.com/in/salmaan-shekabdurahman-0164833a0/" target="_blank">
		<i class="fa fa-linkedin"></i>
		</a>
	</div>
	
	<div class = "Github-card">
		<a href="https://github.com/salmaan2-debug?tab=overview&from=2025-10-01&to=2025-10-31" target="_blank"> 
		<i class="fa fa-github"></i>
		</a>
	</div>
	
</main>
		

<div id="footer-placeholder"></div>

<!-- Load shared components, then theme handling and form validation. -->
<script src="js/component.js"></script> 
<script src="js/theme.js"></script>
<script src="js/validate.js"></script>
</body>

</html>
